name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: parenthalo
          POSTGRES_PASSWORD: parenthalo
          POSTGRES_DB: parenthalo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parenthalo -d parenthalo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      PORT: 3000
      API_PREFIX: api/v1
      CORS_ORIGIN: http://localhost:3000
      RATE_LIMIT_TTL: 60
      RATE_LIMIT_LIMIT: 100
      DATABASE_URL: postgresql://parenthalo:parenthalo@localhost:5432/parenthalo?schema=public
      LOG_LEVEL: error
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build
