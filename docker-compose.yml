services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: parenthalo-api
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: parenthalo-postgres
    environment:
      POSTGRES_USER: parenthalo
      POSTGRES_PASSWORD: parenthalo
      POSTGRES_DB: parenthalo
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parenthalo -d parenthalo"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
